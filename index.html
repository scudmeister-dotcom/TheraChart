<!DOCTYPE html>
<!-- data-theme pins the app to the light palette. Without it the tokens fall
     through to the @media (prefers-color-scheme: dark) block in styles.css and
     the whole content area follows the OS into dark; the sidebar rail stays a
     dark teal gradient either way, by design. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F8A80" />
<!-- declared before the stylesheet so the first paint is light, not a dark flash -->
<meta name="color-scheme" content="light" />
<title>TheraChart EMR</title>
<!-- Brand type: Sora (wordmark/display) + Figtree (UI), self-hosted so nothing
     is fetched from a third-party CDN and the PWA works fully offline. -->
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="printArea" aria-hidden="true"></div>

<script src="parser.js"></script>
<script src="insights.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<script>
// Install as an app: the service worker makes TheraChart launch from a
// phone's home screen like a native app (only when served over http/https).
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
